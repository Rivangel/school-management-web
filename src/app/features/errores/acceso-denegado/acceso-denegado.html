<main class="denegado">
  <mat-card appearance="outlined" class="denegado__card">
    <mat-card-content class="denegado__contenido">
      <mat-icon class="denegado__icono">lock</mat-icon>
      <h1>{{ t('accesoDenegado.titulo') }}</h1>
      <p>
        @if (rol(); as rolActual) {
          {{ t('accesoDenegado.conRolAntes') }} <strong>{{ rolActual }}</strong>
          {{ t('accesoDenegado.conRolDespues') }}
        } @else {
          {{ t('accesoDenegado.sinRol') }}
        }
      </p>
      <p>{{ t('accesoDenegado.pideAAdmin') }}</p>
    </mat-card-content>
    <mat-card-actions class="denegado__acciones">
      <a mat-flat-button routerLink="/">{{ t('accesoDenegado.irAlInicio') }}</a>
      <button mat-button type="button" (click)="salir()">{{ t('shell.cerrarSesion') }}</button>
    </mat-card-actions>
  </mat-card>
</main>
