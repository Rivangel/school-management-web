<header class="portada__saludo">
  <h1>Hola, {{ nombre() }}</h1>
  <p>Entraste como {{ rol() }}. Estas son las secciones a las que tienes acceso.</p>
</header>

<nav class="portada__accesos" aria-label="Secciones disponibles">
  @for (acceso of accesos(); track acceso.ruta) {
    <a class="portada__acceso" [routerLink]="acceso.ruta">
      <mat-icon>{{ acceso.icono }}</mat-icon>
      <span>{{ acceso.etiqueta }}</span>
    </a>
  }
</nav>
