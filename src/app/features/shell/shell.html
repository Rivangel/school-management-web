<mat-sidenav-container class="shell" [hasBackdrop]="modo() === 'over'">
  <mat-sidenav
    class="shell__menu"
    [mode]="modo()"
    [opened]="abierto()"
    (openedChange)="abierto.set($event)"
  >
    <div class="shell__marca">
      <mat-icon>school</mat-icon>
      <span>{{ t('shell.marca') }}</span>
    </div>

    <mat-nav-list>
      @for (elemento of menu(); track elemento.ruta) {
        <a
          mat-list-item
          [routerLink]="elemento.ruta"
          routerLinkActive
          #activo="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: elemento.ruta === '/' }"
          [activated]="activo.isActive"
          (click)="alNavegar()"
        >
          <mat-icon matListItemIcon>{{ elemento.icono }}</mat-icon>
          <span matListItemTitle>{{ t('shell.menu.' + elemento.etiqueta) }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__cuerpo">
    <mat-toolbar class="shell__barra">
      <button
        mat-icon-button
        type="button"
        (click)="alternarMenu()"
        [attr.aria-expanded]="abierto()"
        [attr.aria-label]="t('shell.mostrarOcultarMenu')"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span class="shell__titulo">{{ t('shell.marca') }}</span>
      <span class="shell__separador"></span>

      <button
        mat-icon-button
        type="button"
        class="shell__tema"
        (click)="alternarTema()"
        [attr.aria-label]="etiquetaCambiarTema()"
      >
        <mat-icon>{{ tema() === 'oscuro' ? 'dark_mode' : 'light_mode' }}</mat-icon>
      </button>

      <button
        mat-stroked-button
        type="button"
        class="shell__idioma"
        (click)="alternarIdioma()"
        [attr.aria-label]="etiquetaCambiarIdioma()"
      >
        <mat-icon>translate</mat-icon>
        {{ idioma() === 'es' ? 'ES' : 'EN' }}
      </button>

      <button
        mat-button
        type="button"
        [matMenuTriggerFor]="menuUsuario"
        class="shell__usuario"
        [attr.aria-label]="t('shell.abrirMenuCuenta')"
      >
        <span class="shell__avatar" aria-hidden="true">{{ iniciales() }}</span>
        <span class="shell__nombre">{{ nombre() }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #menuUsuario="matMenu">
        <div class="shell__ficha">
          <strong>{{ nombre() }}</strong>
          <span>{{ email() }}</span>
          <span class="shell__rol">{{ rol() }}</span>
        </div>
        <mat-divider />
        <button mat-menu-item type="button" (click)="salir()">
          <mat-icon>logout</mat-icon>
          <span>{{ t('shell.cerrarSesion') }}</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="shell__contenido">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
